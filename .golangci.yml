version: "2"

run:
  timeout: 5m
  # Tagged test files must be linted too, not only the untagged build.
  build-tags:
    - integration
    - e2e
    - kind

linters:
  default: standard
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - depguard
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gosec
    - lll
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - reassign
    - revive
    - sloglint
    - sqlclosecheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    depguard:
      rules:
        all:
          deny:
            - pkg: github.com/pkg/errors
              desc: use the standard errors package together with internal/shared/errs
            - pkg: io/ioutil
              desc: deprecated, use io and os

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    exhaustive:
      default-signifies-exhaustive: true

    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: write to the structured logger, or to an explicit io.Writer
        - pattern: ^print(ln)?$
          msg: write to the structured logger, or to an explicit io.Writer

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    gosec:
      excludes:
        # Integer conversion overflow: too noisy against database and protobuf widths.
        - G115

    govet:
      enable-all: true
      disable:
        - fieldalignment

    lll:
      line-length: 120
      tab-width: 4

    misspell:
      # The MER of the TCC is written in Portuguese, and the packages that
      # implement an entity name it as the specification does — "MER:
      # progresso_leitura" — so that a reader can find the Quadro the code came
      # from. The checker reads the Portuguese as a misspelling of an English
      # word; the mapping is the point of the comment.
      ignore-rules:
        - progresso

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    revive:
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

    sloglint:
      no-mixed-args: true
      # Prefer the *Context variants wherever a context.Context is in scope.
      context: scope
      static-msg: true
      key-naming-case: snake

    staticcheck:
      checks:
        - all

  exclusions:
    generated: lax
    paths:
      # sqlc and protoc-gen-go output.
      - .*\.pb\.go$
      - .*_grpc\.pb\.go$
      # sqlc writes into internal/<slice>/infra/persist/<slice>db; the
      # repositories beside it are hand-written and are linted.
      - internal/.*/infra/persist/[a-z]+db/.*
    rules:
      # Tests may build fixtures the way tests do.
      - path: _test\.go$
        linters:
          - containedctx
          - dupl
          - gochecknoglobals
          - goconst
          - gosec
          - lll
          - noctx
          - unparam
      # The reference client is a terminal program: printing is its output.
      # It repeats the words a command tree repeats — "list", "create", and the
      # headings of the tables it prints — and a constant named for the word
      # "list" would be a name for the word list.
      - path: ^cmd/quirectl/
        linters:
          - forbidigo
          - goconst
      # The domain packages are named after the entity they own — user.User,
      # device.Device — which is the layout docs/architecture.md follows. Only
      # the stutter check is excluded; the rest of revive still applies there.
      - path: ^internal/[a-z]+/domain/
        linters:
          - revive
        text: stutters
      # errs.Kind is an enum that doubles as an errors.Is target, not a set of
      # sentinel error variables, so the ErrXxx naming convention does not
      # apply to its constants.
      - path: ^internal/shared/errs/kind\.go$
        linters:
          - errname
      # Migrations embedded as long SQL strings.
      - source: ^\s*//go:embed
        linters:
          - lll

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/anthonyvsmuller/quire
    gofumpt:
      module-path: github.com/anthonyvsmuller/quire
      extra:
        group-params: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
