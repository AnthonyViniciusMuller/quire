name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `make lint` installs the version pinned in the Makefile, which stays the
      # single source of truth for the toolchain.
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Check formatting and lint
        run: make lint

      # The contract is read by every node in the federation, including ones
      # this repository will never build, so its own conventions are checked
      # rather than assumed.
      - name: Lint the protobuf definitions
        run: make proto-lint

      - name: Check that go.mod is tidy
        run: |
          make tidy
          git diff --exit-code -- go.mod go.sum

      # The generated code is committed, so a query or a message edited without
      # regenerating would compile against a stale signature and fail somewhere
      # far away.
      - name: Check that the generated code is current
        run: |
          make generate
          git diff --exit-code -- internal

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Unit tests
        run: make cover

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: bin/coverage.out
          if-no-files-found: error

  integration:
    name: integration tests
    runs-on: ubuntu-latest

    # The suite runs against a real PostgreSQL rather than a fake, because what
    # it covers is the statements and the indexes. The runner supplies one, so
    # the repository takes no dependency on a container library in order to
    # start it — see the note in test/integration.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quire
          POSTGRES_PASSWORD: quire
          POSTGRES_DB: quire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        run: make test-integration
        env:
          TEST_DATABASE_URL: postgres://quire:quire@127.0.0.1:5432/quire?sslmode=disable
