name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `make lint` installs the version pinned in the Makefile, which stays the
      # single source of truth for the toolchain.
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Check formatting and lint
        run: make lint

      # The contract is read by every node in the federation, including ones
      # this repository will never build, so its own conventions are checked
      # rather than assumed.
      - name: Lint the protobuf definitions
        run: make proto-lint

      - name: Check that go.mod is tidy
        run: |
          make tidy
          git diff --exit-code -- go.mod go.sum

      # The generated code is committed, so a query or a message edited without
      # regenerating would compile against a stale signature and fail somewhere
      # far away.
      - name: Check that the generated code is current
        run: |
          make generate
          git diff --exit-code -- internal

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Unit tests
        run: make cover

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: bin/coverage.out
          if-no-files-found: error

  integration:
    name: integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The suite runs against a real PostgreSQL and a real object store rather
      # than fakes, because what it covers is the statements, the indexes and
      # the bytes. It starts them the way a developer does — `make test-up` is
      # two `docker run` lines and no container library, which is the note in
      # test/integration — rather than through service containers, and that is
      # not a preference. A service container cannot override the image's
      # command, and MinIO's needs `server /data`, so the object store could not
      # be declared as one at all.
      #
      # Both ways existed here for a while and only one of them worked: the
      # database was a service container and the object store was nothing, so
      # the suite panicked on an endpoint that was not answering. One way of
      # starting the dependencies is what keeps CI and a laptop from disagreeing
      # about what the suite needs.
      - name: Start the database and the object store
        run: make test-up

      - name: Integration tests
        run: make test-integration

      - name: Stop them
        if: always()
        run: make test-down

  # The manifests, run rather than rendered.
  #
  # It is the one job that answers a question none of the others can: whether a
  # node starts under QUIRE_ENV=production, whether two of them find each other
  # through a mesh that terminates one port and passes another through, and
  # whether the certificate a peer pins survives the trip. A YAML file that
  # parses is not a deployment, and the two findings of this phase — C23 and the
  # authority the discovery documents are verified against — are both things
  # only a running cluster says out loud.
  #
  # It is slow, and that is priced in: it builds two images, installs a mesh and
  # a certificate authority, and waits for a replication interval that is the
  # production one.
  kind:
    name: end-to-end on kind
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned for the reason everything else in this repository is: a cluster
      # that installed whatever was newest is a cluster nobody can reproduce,
      # and the mesh version decides how a passed-through port behaves.
      - name: Install kind and istioctl
        env:
          KIND_VERSION: v0.32.0
          ISTIO_VERSION: 1.30.3
        run: |
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL \
            "https://github.com/istio/istio/releases/download/${ISTIO_VERSION}/istioctl-${ISTIO_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/istioctl /usr/local/bin/istioctl

      # The suite reaches each node by its domain and not by the loopback
      # address, because the gateway routes the federation port on SNI and
      # presents a certificate for the domain. kind-up asks for this and will
      # not do it itself: a script that needed a password to bring up a test
      # cluster is a script nobody should run.
      - name: Resolve the federation domains
        run: echo "127.0.0.1 quire-a.example quire-b.example" | sudo tee -a /etc/hosts

      - name: Bring up the federation
        run: make kind-up

      - name: End-to-end tests
        run: make test-kind

      # A failure here is a deployment failure, and the deployment is what has to
      # be read to understand it. The node's own log is last because it is the
      # longest, and the events above it are usually what actually happened.
      - name: What the cluster said
        if: failure()
        run: |
          kubectl get nodes -o wide
          for namespace in quire-a quire-b; do
            echo "::group::$namespace"
            kubectl -n "$namespace" get all,certificates
            kubectl -n "$namespace" get events --sort-by=.lastTimestamp | tail -40
            kubectl -n "$namespace" describe pods
            kubectl -n "$namespace" logs -l app.kubernetes.io/component=node \
              --tail=300 --all-containers --ignore-errors || true
            echo "::endgroup::"
          done
