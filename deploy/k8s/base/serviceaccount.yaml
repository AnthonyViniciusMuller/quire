# The identity the node runs as.
#
# It is its own rather than default, and it holds no role: the node talks to
# PostgreSQL, to an object store and to its peers, and to nothing in the API
# server. What it is for is the mesh, which identifies a workload by its service
# account — so an authorization policy naming this account names this node and
# not whatever else happens to run in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quire
automountServiceAccountToken: false
