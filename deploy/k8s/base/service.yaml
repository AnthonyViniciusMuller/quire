# What reaches the node inside the cluster.
#
# The port names are what the mesh reads: Istio decides how to treat a port from
# the prefix of its name. The API port is named tls-grpc and not grpc, and that
# is C23 arriving one level lower than where it was written.
#
# What crosses 9090 is not gRPC. It is TLS, terminated by the node itself,
# because the federation connection is pinned at both ends and the gateway
# passes it through untouched — so the bytes the sidecar sees are a ClientHello.
# Named grpc, the sidecar treats them as HTTP/2 and the handshake dies inside
# the mesh with no useful error at either end. Named tls-, it forwards them.
#
# The cost is real and is the price of C23: the mesh can offer no per-method
# telemetry and no per-method authorization for the API, because it cannot see
# inside a connection it must not terminate. What it can still say is which
# workload talked to which, and for how long.
apiVersion: v1
kind: Service
metadata:
  name: quire
spec:
  selector:
    app.kubernetes.io/name: quire
    app.kubernetes.io/component: node
  ports:
    - name: tls-grpc
      port: 9090
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
