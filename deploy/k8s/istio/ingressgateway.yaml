# The node's own ingress gateway.
#
# One gateway per node rather than one shared by the cluster, and the reason is
# not convenience. Two nodes in a federation belong to two operators who share
# no authority — that is the premise C12 is built on — so a topology where they
# share an ingress is a topology that does not model what is being built. Each
# node owns the thing that answers for its domain, holds the certificate that
# identifies it, and is named by its own authorization policy.
#
# It is the injected-gateway form rather than a second `istioctl install`: an
# ordinary Deployment and Service with the injection label, so that it lands in
# the node's namespace, gets the namespace's own configuration, and is deployed
# and deleted with the node it belongs to. What it costs is that the pod is an
# Envoy this repository declares rather than one the mesh installs, which is
# forty lines and no operator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quire-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quire
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quire
        app.kubernetes.io/component: gateway
        # What the Gateway resource selects on, and what tells the mesh this
        # pod is a gateway rather than a workload with a sidecar.
        #
        # The overlay patches it to carry the namespace, and that is not
        # decoration: an Istio Gateway binds to every proxy in the mesh whose
        # labels match its selector, in any namespace. Two nodes sharing this
        # value are two gateways each serving whichever configuration istiod
        # resolved last — which is what happened, and what it looked like was a
        # gateway in quire-b answering for SNI quire-a.example.
        istio: quire-gateway
        sidecar.istio.io/inject: "true"
        app: quire-gateway
        version: v1
      annotations:
        inject.istio.io/templates: gateway
    spec:
      serviceAccountName: quire-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The name is what the injection template replaces with the proxy. An
        # image is required by the API and is never the one that runs.
        - name: istio-proxy
          image: auto
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quire-gateway
# The proxy authenticates to the mesh with the projected istio-token the
# injection adds, and needs nothing from the API server itself. Turning the
# default token off is what makes the Role below safe to grant: istiod's
# authorization check is about what this account *may* do, and without a token
# in the pod there is nothing that can do it.
automountServiceAccountToken: false
---
# What lets the gateway be handed its own certificate.
#
# Istio serves a `credentialName` over SDS only after asking the API server
# whether the *proxy's* service account may read that secret, so a gateway with
# no rights to it gets a listener with no certificate and every handshake fails
# in the transport — which is what happened, and what the mesh reported as
# "attempted to access unauthorized certificates".
#
# It cannot be narrowed to the one certificate, and that was tried first: istiod
# asks whether the account may *list* secrets in the namespace, with no name in
# the question, so a Role restricted by resourceNames answers no to exactly the
# question being asked. This is the same Role the default ingress gateway ships
# with.
#
# What makes it acceptable is the line above. The gateway shares a namespace
# with the node, and that namespace holds the node's signing key and its
# database password — a gateway that could read them would be one compromise
# away from the whole account system. It cannot: the permission exists for
# istiod's check and the pod carries no token to exercise it with.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quire-gateway-sds
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quire-gateway-sds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quire-gateway-sds
subjects:
  - kind: ServiceAccount
    name: quire-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: quire-gateway
spec:
  selector:
    app.kubernetes.io/name: quire
    app.kubernetes.io/component: gateway
  ports:
    # 80 redirects, 443 serves the discovery documents, and 9443 passes the
    # federation connection through untouched. What is not here is 9090: the
    # node's own Service carries that, inside the mesh, for callers that are
    # already in it.
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
    - name: tls-federation
      port: 9443
      targetPort: 9443
