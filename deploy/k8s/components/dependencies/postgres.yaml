# The node's database, on the cluster that runs it.
#
# A StatefulSet with one replica and a volume, which is the smallest honest
# shape: a Deployment with a volume is a Deployment that will one day roll a
# second pod onto the same disk.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quire-postgres
spec:
  serviceName: quire-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quire
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quire
        app.kubernetes.io/component: postgres
        # What the mesh's telemetry groups by. It reads app and version and
        # nothing else, so a workload labelled only in the Kubernetes
        # convention is one whose metrics arrive unattributed.
        app: quire-postgres
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_USER
              value: quire
            - name: POSTGRES_DB
              value: quire
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: quire-postgres
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, quire, -d, quire]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: quire-postgres
spec:
  selector:
    app.kubernetes.io/name: quire
    app.kubernetes.io/component: postgres
  ports:
    # tcp-postgres and not postgres: Istio decides how to treat a port from the
    # prefix of its name, and a name it does not recognize is a port it refuses
    # to admit into the mesh at all.
    - name: tcp-postgres
      port: 5432
      targetPort: postgres
